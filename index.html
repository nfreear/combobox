<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="assets/app.css">

<title>my-combobox</title>

<header>
  <h1>my-combobox</h1>
</header>
<main>
  <p>A custom element for an editable combobox, with list autocomplete.</p>

  <form>
  <label for="cty">Choose a country</label>

  <my-autocomplete-combobox id="cty" name="country" pattern="[a-zA-Z ]+" minlength="5" maxlength="30" autocomplete="off" required>
    <!-- Choose a country -->

    <template shadowrootmode="open">
      <link rel="stylesheet" href="assets/my-combobox.css">
      <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/SebastianAigner/twemoji-amazing/twemoji-amazing.css">
      <span class="row">
        <slot></slot>
        <!--<label for="input"><slot></slot></label>-->
        <input id="input" role="combobox" aria-describedby="status" aria-controls="list" aria-haspopup="listbox" aria-autocomplete="list" aria-expanded="false">
        <button commandfor="input" command="--clear" aria-label="Clear"></button>
        <button commandfor="popover" command="toggle-popover" aria-label="Toggle options" tabindex="-1"></button>
      </span>
      <div id="popover" popover>
        <output id="status"><!-- Live region, initially empty --></output>
        <ul id="list" role="listbox" aria-label="Country options"><!-- Via JSON fetch. --></ul>
      </div>
    </template>
  </my-autocomplete-combobox>


    <p><button type="submit">Submit</button></p>
    <p><output name="output"></output></p>
  <form>

</main>
<footer>
  <p>Source: <a href="https://github.com/nfreear/combobox">@nfreear/combobox</a></p>
</footer>

<p><my-dev-warning></my-dev-warning></p>


<script type="importmap"> {
  "imports": {
    "ndf-elements/i": "https://nfreear.github.io/elements/i.js",
    "ndf-elements/dev": "https://esm.sh/gh/nfreear/elements/dev"
  },
  "myElements": {
    "use": [ "my-dev-warning" ]
  }
} </script>

<script type="module" src="assets/app.js?run=default"></script>
</html>
